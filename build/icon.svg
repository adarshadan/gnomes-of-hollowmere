  <ellipse cx="468" cy="524" rx="12" ry="15" fill="#2a1a10"/><ellipse cx="556" cy="524" rx="12" ry="15" fill="#2a1a10"/>
  <circle cx="472" cy="519" r="4" fill="#fff"/><circle cx="560" cy="519" r="4" fill="#fff"/>
  <ellipse cx="440" cy="566" rx="22" ry="12" fill="#ff8a8a" opacity=".55"/><ellipse cx="584" cy="566" rx="22" ry="12" fill="#ff8a8a" opacity=".55"/>
  <ellipse cx="512" cy="566" rx="34" ry="30" fill="#f2a882"/><ellipse cx="502" cy="556" rx="10" ry="7" fill="#fff" opacity=".5"/>
  <path d="M470 604 Q512 628 554 604" stroke="#b07060" stroke-width="7" fill="none" stroke-linecap="round"/>
