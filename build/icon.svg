<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="soft" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3b2560"/><stop offset=".55" stop-color="#1e1433"/><stop offset="1" stop-color="#0d0915"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0"/><stop offset=".55" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffe9b8" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff0c4" stop-opacity=".95"/><stop offset=".5" stop-color="#ffc860" stop-opacity=".45"/><stop offset="1" stop-color="#ffb040" stop-opacity="0"/></radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a4f"/><stop offset=".55" stop-color="#d0302a"/><stop offset="1" stop-color="#8e1820"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3a0"/><stop offset="1" stop-color="#c99541"/></linearGradient>
    <radialGradient id="face" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#ffd9bf"/><stop offset="1" stop-color="#e8a888"/></radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d2e6"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a7ad0"/><stop offset="1" stop-color="#26437e"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="#fff" opacity=".85">
    <circle cx="150" cy="170" r="5"/><circle cx="860" cy="140" r="6"/><circle cx="780" cy="300" r="3.5"/><circle cx="210" cy="360" r="3.5"/>
    <circle cx="905" cy="470" r="4"/><circle cx="110" cy="560" r="4.5"/><circle cx="330" cy="120" r="3"/><circle cx="660" cy="90" r="3.5"/>
