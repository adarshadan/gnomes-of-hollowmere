  <rect x="384" y="760" width="256" height="34" rx="10" fill="#5a3418"/><rect x="490" y="756" width="44" height="42" rx="6" fill="url(#gold)"/>
  <!-- beard -->
  <path d="M392 556 C 380 690, 450 790, 512 812 C 574 790, 644 690, 632 556 C 600 600, 424 600, 392 556 Z" fill="url(#beard)"/>
