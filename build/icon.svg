  <path d="M190 180 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 l26 -10z" fill="#ffe9b0" opacity=".9"/>
  <path d="M836 236 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7z" fill="#bfe4ff" opacity=".9"/>
