  <rect x="356" y="448" width="312" height="52" rx="26" fill="url(#gold)"/>
  <rect x="356" y="448" width="312" height="14" rx="7" fill="#fff" opacity=".35"/>
  <circle cx="512" cy="474" r="17" fill="#3fb0ff" stroke="#fff3c4" stroke-width="5"/>
