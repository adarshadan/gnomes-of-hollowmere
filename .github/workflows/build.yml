name: Build and release

# Every push to main builds the web app, the Android app and the Windows app,
# publishes the web app to GitHub Pages and attaches the apps to a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build offline bundle
        run: node tools/build-www.mjs
      - id: ver
        name: Read game version
        run: echo "version=$(grep -o 'name="game-version" content="[0-9]*' game/gnomes-of-hollowmere.html | grep -o '[0-9]*$')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: dist/gnomes-of-hollowmere-standalone.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  pages:
    name: Publish to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: node tools/build-www.mjs
      - run: bash tools/android-setup.sh
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: |
          V=$(grep -o 'name="game-version" content="[0-9]*' game/gnomes-of-hollowmere.html | grep -o '[0-9]*$')
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/Gnomes-of-Hollowmere-v${V}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node tools/build-www.mjs
      - name: Build Windows installer
        run: npx tauri build
      - name: Collect installers
        shell: bash
        run: |
          V=$(grep -o 'name="game-version" content="[0-9]*' game/gnomes-of-hollowmere.html | grep -o '[0-9]*$')
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/Gnomes-of-Hollowmere-v${V}-Windows-Setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "out/Gnomes-of-Hollowmere-v${V}-Windows.msi"
          cp src-tauri/target/release/gnomes-of-hollowmere.exe "out/Gnomes-of-Hollowmere-v${V}-Windows-Portable.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    name: GitHub release
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Name the standalone file
        run: mv files/gnomes-of-hollowmere-standalone.html "files/Gnomes-of-Hollowmere-v${{ needs.web.outputs.version }}-Standalone.html"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.web.outputs.version }}
          name: Gnomes of Hollowmere, version ${{ needs.web.outputs.version }}
          make_latest: true
          files: files/*
          body: |
            **Play in your browser:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            | Download | For |
            |---|---|
            | `…-Windows-Setup.exe` | Windows 10 and 11: installs the game with a Start menu shortcut |
            | `…-Windows-Portable.exe` | Windows 10 and 11: runs without installing |
            | `…-Windows.msi` | Windows: installer for managed PCs |
            | `…-Android.apk` | Android phones and tablets (allow "Install unknown apps" when asked) |
            | `…-Standalone.html` | Any device: open in a browser, works offline |
